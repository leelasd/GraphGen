# chemistry/configs/chemistry_mmp_config.yaml
# KG2 → matched molecular pair SAR QA (ChatML format)
# Uses include_edges: true to load Tanimoto/scaffold/MMP edges that connect
# structurally related molecules. Partitions into pairs for SAR analysis.
global_params:
  working_dir: chemistry/output/kg2_mmp_cache
  graph_backend: networkx
  kv_backend: json_kv

nodes:
  - id: read
    op_name: read
    type: source
    dependencies: []
    params:
      input_path:
        - chemistry/kg2_build/molecule_graph.graphml
      include_edges: true

  - id: chunk
    op_name: chunk
    type: map_batch
    dependencies:
      - read
    params:
      chunk_size: 4096
      chunk_overlap: 0

  - id: partition
    op_name: partition
    type: aggregate
    dependencies:
      - chunk
    params:
      method: ece
      method_params:
        max_units_per_community: 3
        min_units_per_community: 3
        max_tokens_per_community: 10240
        unit_sampling: random

  - id: generate
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 1
      batch_size: 64
    save_output: true
    params:
      method: matched_molecular_pair
      data_format: ChatML
