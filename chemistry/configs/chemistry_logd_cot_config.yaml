# chemistry/configs/chemistry_logd_cot_config.yaml
# KG2 → logD chain-of-thought (CoT) prediction QA (ChatML format)
#
# Generates training data where:
#   question: contains ONLY the SMILES string (no logD, no descriptors)
#   answer:   4-step CoT reasoning:
#               Step 1 — SMILES parsing: identify FGs, ring systems, heteroatoms
#               Step 2 — FG contributions: explain each group's effect on logD
#               Step 3 — Descriptor analysis: interpret MW, LogP, TPSA, HBD, HBA, RotBonds
#               Step 4 — LogD prediction: final value, bin (low/mid/high), PK implication
#
# Purpose: train a model to reason about molecular structure → logD, not just memorize values.
# Each molecule in the graph produces one CoT prediction example.
global_params:
  working_dir: chemistry/output/kg2_logd_cot_cache
  graph_backend: networkx
  kv_backend: json_kv

nodes:
  - id: read
    op_name: read
    type: source
    dependencies: []
    params:
      input_path:
        - chemistry/kg2_build/molecule_graph.graphml
      include_edges: false

  - id: chunk
    op_name: chunk
    type: map_batch
    dependencies:
      - read
    params:
      chunk_size: 4096
      chunk_overlap: 0

  - id: partition
    op_name: partition
    type: aggregate
    dependencies:
      - chunk
    params:
      method: ece
      method_params:
        # max_units=1: single molecule per batch — one CoT example per molecule
        max_units_per_community: 1
        min_units_per_community: 1
        max_tokens_per_community: 4096
        unit_sampling: random

  - id: generate
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 1
      batch_size: 64
    save_output: true
    params:
      method: chemistry_logd_cot
      data_format: ChatML
